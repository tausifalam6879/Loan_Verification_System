spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Keep the free Render instance focused on authentication and API traffic.
# Swagger remains available locally, but its model scan does not delay a
# production cold start.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Neon scales independently. A small pool avoids opening unnecessary database
# connections while still keeping login responsive after the service wakes.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=0

spring.h2.console.enabled=false
app.otp.console-fallback.enabled=false
