services:
  - type: web
    name: fintrack-market-ai
    runtime: python
    region: singapore
    plan: free
    rootDir: ai-fraud-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Render currently defaults new Python services to 3.14; the pinned ML
      # stack has stable binary wheels on Python 3.12.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: MARKET_CACHE_TTL_SECONDS
        value: "120"
      - key: MARKET_QUOTE_CACHE_TTL_SECONDS
        value: "15"
      - key: MARKET_OVERVIEW_CACHE_TTL_SECONDS
        value: "900"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_MS
        value: "12000"

  - type: web
    name: fintrack-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/users/test
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: APP_AI_SERVICE_URL
        # Use the public HTTPS service URL. This keeps the Docker API able to
        # reach the Python market service reliably on Render's free instances.
        value: https://fintrack-market-ai.onrender.com
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://tausifalam6879.github.io
      - key: APP_OTP_ENABLED
        value: "true"
      - key: APP_OTP_CONSOLE_FALLBACK_ENABLED
        value: "false"
      # Render Free blocks outbound SMTP ports, so production email OTP uses
      # Resend's HTTPS API. Verify a sender domain before using a public address.
      - key: APP_MAIL_ENABLED
        value: "true"
      - key: APP_MAIL_PROVIDER
        value: resend
      - key: APP_MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # SMS and WhatsApp delivery use Twilio's HTTPS API.
      - key: APP_SMS_ENABLED
        value: "true"
      - key: APP_WHATSAPP_ENABLED
        value: "true"
      - key: APP_SMS_DEFAULT_COUNTRY_CODE
        value: "+91"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: fintrack-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fintrack-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fintrack-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fintrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fintrack-db
          property: password

databases:
  - name: fintrack-db
    region: singapore
    plan: free
    databaseName: fintrack
    user: fintrack
