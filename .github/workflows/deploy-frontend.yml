name: Deploy frontend to GitHub Pages

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "ai-fraud-service/market_intelligence.py"
      - "ai-fraud-service/requirements.txt"
      - "scripts/generate_market_snapshot.py"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-fraud-service/requirements.txt

      - name: Refresh interview-safe market snapshot
        working-directory: .
        run: |
          pip install -r ai-fraud-service/requirements.txt
          python scripts/generate_market_snapshot.py

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build production frontend
        run: npm run build
        env:
          REACT_APP_DEMO_MODE: "false"
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL || 'https://fintrack-api.onrender.com/api' }}
          CI: "false"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
