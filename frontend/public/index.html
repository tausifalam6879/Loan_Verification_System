<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b2f73" />
    <meta
      name="description"
      content="FinTrack is a secure personal finance, loan verification and market intelligence workspace."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // Start waking the hosted authentication API before the React/MUI bundle
      // downloads and renders. CRA replaces these placeholders at build time.
      // authService reuses this same promise, so this does not create a duplicate
      // warm-up request.
      (function () {
        var apiBaseUrl = "%REACT_APP_API_BASE_URL%";
        var demoMode = "%REACT_APP_DEMO_MODE%" === "true";
        if (!demoMode && /^https:\/\//.test(apiBaseUrl)) {
          var controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 20000);
          window.__fintrackAuthWarmup = fetch(apiBaseUrl + "/users/auth-config", {
            signal: controller.signal,
            cache: "no-store",
            headers: { Accept: "application/json" }
          }).then(function (response) {
            if (!response.ok) {
              throw new Error("Authentication service warm-up failed");
            }
            return response.json();
          }).finally(function () { clearTimeout(timeout); });
          // The React service attaches the real error handler when it mounts.
          // This prevents a console-level unhandled rejection if another route
          // renders first.
          window.__fintrackAuthWarmup.catch(function () {});
        }
      })();
    </script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>FinTrack | Financial Command Center</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
